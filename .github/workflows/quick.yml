name: Quick checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIRLOCK_LOG_DIR: ${{ github.workspace }}/.airlock-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read pinned applications
        id: applications
        run: echo "revision=$(cat application-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: airlock-org/airlock
          ref: ${{ steps.applications.outputs.revision }}
          path: .airlock-cache/applications
          persist-credentials: false
          token: ${{ secrets.AIRLOCK_CI_READ_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare native development tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup override set stable
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-4-dev libadwaita-1-dev bubblewrap xvfb dbus nodejs jq util-linux e2fsprogs ripgrep build-essential
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Attach candidate machine to the shared application test checkout
        run: |
          applications="$PWD/.airlock-cache/applications"
          if [ -d "$applications/airlock-machine" ]; then rmdir "$applications/airlock-machine"; fi
          ln -s "$PWD" "$applications/airlock-machine"
          echo "AIRLOCK_TEST_SOURCE=$applications" >> "$GITHUB_ENV"
          echo "AIRLOCK_APPS=$applications/crates" >> "$GITHUB_ENV"
          echo "AIRLOCK_CARGO_VENDOR=$applications/.airlock-cache/authoring-vendor" >> "$GITHUB_ENV"
      - name: Prepare native tests and check machine authoring
        run: |
          make -C "$AIRLOCK_TEST_SOURCE" prepare-dependencies native-integration-build
          make rust-check
      - name: Exercise shared native machine regressions
        run: |
          make -C "$AIRLOCK_TEST_SOURCE" test-quick
          make -C "$AIRLOCK_TEST_SOURCE" test-native-mounts
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: machine-native-test-reports
          path: .airlock-logs/
          include-hidden-files: true
          retention-days: 7
